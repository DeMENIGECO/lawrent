[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lawrent"
version = "0.1.0"
description = "A Linux desktop environment contained in one GTK window"
requires-python = ">=3.10"
dependencies = ["PyGObject>=3.46"]

[project.scripts]
lawrent = "lawrent.main:main"

[tool.setuptools.packages.find]
include = ["lawrent*"]
